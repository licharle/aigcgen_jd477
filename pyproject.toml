[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "licharle-aigcgen_jd477"
version = "0.1.0"
description = "按给定权重把总额度分配到各项，报告超分配项与利用率"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "licharle" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://licharle.github.io"
Repository = "https://github.com/licharle/aigcgen_jd477"
Issues = "https://github.com/licharle/aigcgen_jd477/issues"

[project.scripts]
aigcgen_jd477 = "aigcgen_jd477:main"

[tool.setuptools]
py-modules = ["aigcgen_jd477"]
